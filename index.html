<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QA Agent</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f2f3f5;--cd:#fff;--tx:#17212b;--mu:#4f5b66;--bd:#e1e4e8;--ac:#1a6fb3;--okb:#e3f4e8;--ok:#14612f;--bdb:#fde8e7;--bad:#9c1c14;--blb:#fff1d6;--bl:#7a4b00;--skb:#e9ecef;--sk:#3d4852;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--cd:#182430;--tx:#e8eef4;--mu:#a9b6c3;--bd:#2b3a48;--ac:#6db4ec;--okb:#123524;--ok:#7fdc9f;--bdb:#3b1816;--bad:#ff9a92;--blb:#3a2a08;--bl:#f2c46a;--skb:#2a3540;--sk:#c3ced8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1720;--cd:#182430;--tx:#e8eef4;--mu:#a9b6c3;--bd:#2b3a48;--ac:#6db4ec;--okb:#123524;--ok:#7fdc9f;--bdb:#3b1816;--bad:#ff9a92;--blb:#3a2a08;--bl:#f2c46a;--skb:#2a3540;--sk:#c3ced8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,Roboto,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--cd);z-index:10}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;height:56px;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 8px}
header h1{font-size:17px;margin:0;font-weight:600}
.lk{background:none;border:0;color:var(--ac);font-size:15px;min-height:44px;min-width:44px;padding:0 8px;cursor:pointer}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px}
.l{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:6px}
.m{font-size:13px;color:var(--mu)}.t{font-weight:600}
.in{width:100%;box-sizing:border-box;height:48px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;font-size:16px;background:var(--cd);color:var(--tx)}
.b{height:52px;border:0;border-radius:12px;background:#1a6fb3;color:#fff;font-size:16px;font-weight:600;flex:1;cursor:pointer}
.b:disabled{opacity:.45;cursor:not-allowed}
.b2{background:var(--cd);color:var(--tx);border:1px solid var(--bd)}
footer{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--cd);border-top:1px solid var(--bd);padding:12px 16px;display:flex;gap:10px}
.r{display:flex;align-items:center;gap:12px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:#1a6fb3}
.p{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;display:inline-block}
.Pass,.ok{background:var(--okb);color:var(--ok)}.Fail,.bad{background:var(--bdb);color:var(--bad)}.Blocked,.bl{background:var(--blb);color:var(--bl)}.Skip,.sk{background:var(--skb);color:var(--sk)}.run{background:var(--skb);color:var(--ac)}
.menu{width:100%;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--tx);font:inherit}
.chk{width:24px;height:24px;accent-color:#1a6fb3;flex:none}
.pl{width:44px;height:44px;border-radius:50%;border:0;background:#1a6fb3;color:#fff;font-size:18px;cursor:pointer;flex:none}
.sb{flex:1;min-height:48px;border-radius:10px;font-size:14px;font-weight:600;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer}
.sb.on{border:2px solid var(--ac);background:var(--skb)}
.dz{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px;border:2px dashed var(--ac);border-radius:14px;cursor:pointer;text-align:center;background:var(--cd)}
.dz input{display:none}
.empty{text-align:center;padding:32px 8px;color:var(--mu)}
.pv{display:flex;flex-direction:column;gap:10px}.pv canvas{width:100%;height:auto;background:#fff;border:1px solid var(--bd);border-radius:4px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#17212b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%}
</style>
</head>
<body>
<div id="app"><header><button class="lk" id="bk" data-a="back" aria-label="Kembali" hidden>‹ Kembali</button><h1 id="t">QA Agent</h1></header><main id="m"></main><footer id="f" hidden></footer></div>
<div id="toast" role="status" hidden></div>
<script>
var K="qa-agent-v1",db={sets:[],execs:[]},S={v:"home",draft:null,pick:{},id:null,pdf:null,pdfId:null};
try{var raw=localStorage.getItem(K);if(raw)db=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(x){var e=$("#toast");e.textContent=x;e.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){e.hidden=true},2600)}
function ex(id){return db.execs.filter(function(e){return e.id===id})[0]}
function cnt(e){var c={Pass:0,Fail:0,Blocked:0,Skip:0,n:0};e.cases.forEach(function(x){if(x.s){c[x.s]++;c.n++}});return c}
var ST=["Pass","Fail","Blocked","Skip"];
var SAMPLE=[["TC-001","Login dengan kredensial valid","1. Buka halaman login\n2. Isi email dan password valid\n3. Tekan Masuk","Pengguna masuk ke beranda"],["TC-002","Login dengan password salah","1. Buka halaman login\n2. Isi password salah\n3. Tekan Masuk","Muncul pesan “Email atau password salah”"],["TC-003","Registrasi dengan email terdaftar","1. Buka halaman registrasi\n2. Isi email yang sudah terdaftar\n3. Tekan Daftar","Muncul pesan email sudah digunakan"],["TC-004","Reset password lewat email","1. Tekan Lupa password\n2. Isi email\n3. Buka tautan di email","Password baru berhasil disimpan"]];
function toCases(a){return a.map(function(r){return{id:r[0],sc:r[1],st:r[2],ex:r[3]}})}
function parse(rows){
 rows=rows.filter(function(r){return r.some(function(c){return String(c).trim()!==""})});
 if(rows.length<2)return[];
 var h=rows[0].map(function(c){return String(c).toLowerCase()});
 function f(re){for(var i=0;i<h.length;i++)if(re.test(h[i]))return i;return-1}
 var i1=f(/^(id|no|kode|tc)/),i2=f(/scenario|skenario|judul|title|nama|summary/),i3=f(/step|langkah/),i4=f(/expected|harapan|hasil/);
 if(i2<0)i2=i1===0?1:0;
 return rows.slice(1).map(function(r,i){return{id:String(i1>=0&&r[i1]!==""?r[i1]:"TC-"+String(i+1).padStart(3,"0")),sc:String(r[i2]||""),st:i3>=0?String(r[i3]):"",ex:i4>=0?String(r[i4]):""}}).filter(function(c){return c.sc})
}
var V={
home:function(){var n=db.sets.reduce(function(a,s){return a+s.cases.length},0);
 function mi(g,t,d){return'<button class="cd menu" data-a="go" data-g="'+g+'"><span style="flex:1"><span class="t" style="display:block">'+t+'</span><span class="m">'+d+'</span></span><span aria-hidden="true">›</span></button>'}
 return{t:"QA Agent",b:'<div class="m">Kelola test case dan test execution.</div>'+mi("imp","Import Test Case",db.sets.length+" kumpulan · "+n+" test case")+mi("new","Buat Test Execution","Pilih kumpulan test case")+mi("list","Test Execution",db.execs.length+" execution")}},
imp:function(){var d=S.draft;
 return{t:"Import Test Case",b:'<label class="dz"><input type="file" id="fx" accept=".xlsx,.xls,.csv"><span class="t">'+(d?esc(d.file):"Pilih file Excel")+'</span><span class="m">'+(d?d.cases.length+" test case terdeteksi":"Kolom: ID, Scenario, Steps, Expected (.xlsx / .csv)")+'</span></label><button class="lk" data-a="sample" style="align-self:center">Pakai data contoh</button>'+(d?'<div><label class="l" for="ti">Judul test case</label><input class="in" id="ti" value="'+esc(d.title)+'"></div><div class="cd" style="padding:0"><div class="m" style="padding:10px 14px;font-weight:600">Pratinjau ('+Math.min(3,d.cases.length)+" dari "+d.cases.length+")</div>"+d.cases.slice(0,3).map(function(c){return'<div style="padding:10px 14px;border-top:1px solid var(--bd)"><div class="m">'+esc(c.id)+"</div>"+esc(c.sc)+"</div>"}).join("")+"</div>":""),f:'<button class="b" data-a="saveset"'+(d?"":" disabled")+">Simpan Test Case</button>"}},
new:function(){
 if(!db.sets.length)return{t:"Buat Test Execution",b:'<div class="empty">Belum ada test case tersimpan.<br>Import dulu lewat menu Import Test Case.</div>',f:'<button class="b" data-a="go" data-g="imp">Import Test Case</button>'};
 return{t:"Buat Test Execution",b:'<div><label class="l" for="te">Judul test execution</label><input class="in" id="te" placeholder="mis. Regression Sprint 12"></div><div class="l" style="margin:4px 0 0">Pilih kumpulan test case</div>'+db.sets.map(function(s){return'<label class="cd r"><input class="chk" type="checkbox" data-s="'+s.id+'"'+(S.pick[s.id]?" checked":"")+'><span><span class="t" style="display:block">'+esc(s.title)+'</span><span class="m">'+s.cases.length+" test case · "+esc(s.at)+"</span></span></label>"}).join(""),f:fsub()}},
list:function(){return{t:"Test Execution",b:db.execs.length?db.execs.map(function(e){var c=cnt(e),n=e.cases.length,p=Math.round(c.n/n*100);
 return'<div class="cd" style="display:flex;flex-direction:column;gap:10px"><div class="r"><div style="flex:1"><div class="t">'+esc(e.title)+'</div><div class="m">'+n+' test case'+(e.report?" · "+esc(e.report.name):"")+'</div></div><button class="pl" data-a="play" data-i="'+e.id+'" aria-label="Play '+esc(e.title)+'">▶</button></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="r" style="justify-content:space-between"><span class="m">'+c.n+" dari "+n+' dinilai</span><span class="p '+(e.done?"ok":c.n?"run":"sk")+'">'+(e.done?"Selesai":c.n?"Berjalan":"Belum mulai")+"</span></div>"+(e.done?'<button class="lk" data-a="rep" data-i="'+e.id+'" style="align-self:flex-start;padding:0">Lihat report PDF</button>':"")+"</div>"}).join(""):'<div class="empty">Belum ada test execution.</div>',f:'<button class="b" data-a="go" data-g="new">Buat Test Execution</button>'}},
run:function(){var e=ex(S.id),c=e.cases[e.idx],n=e.cases.length,k=cnt(e).n,last=e.idx===n-1;
 return{t:e.title,b:'<div><div class="r" style="justify-content:space-between;margin-bottom:6px"><span class="m">Test case '+(e.idx+1)+" dari "+n+'</span><span class="m">'+Math.round(k/n*100)+'%</span></div><div class="bar"><i style="width:'+k/n*100+'%"></i></div></div><div class="cd" style="display:flex;flex-direction:column;gap:8px"><div class="m">'+esc(c.id)+'</div><div class="t">'+esc(c.sc)+'</div>'+(c.st?'<div class="m t">Langkah</div><div style="white-space:pre-line">'+esc(c.st)+"</div>":"")+(c.ex?'<div class="m t">Hasil yang diharapkan</div><div>'+esc(c.ex)+"</div>":"")+'</div><div><div class="l">Status</div><div class="r" style="gap:8px">'+ST.map(function(s){return'<button class="sb'+(c.s===s?" on":"")+'" data-a="st" data-s="'+s+'" aria-pressed="'+(c.s===s)+'">'+s+"</button>"}).join("")+'</div></div><div><label class="l" for="no">Catatan</label><input class="in" id="no" value="'+esc(c.note||"")+'"></div>',f:'<button class="b b2" data-a="prev"'+(e.idx?"":" disabled")+'>Sebelumnya</button><button class="b" data-a="next">'+(last?"Selesai":"Berikutnya")+"</button>"}},
fin:function(){var e=ex(S.id),c=cnt(e),n=e.cases.length,p=S.pdf&&S.pdfId===e.id?S.pdf:null,rate=n?Math.round(c.Pass/n*100):0;
 return{t:"Selesaikan Pengujian",b:'<div class="t">'+esc(e.title)+'</div><div class="r" style="gap:8px">'+ST.map(function(s){return'<div class="cd" style="flex:1;text-align:center;padding:12px 4px"><div class="t" style="font-size:22px">'+c[s]+'</div><span class="p '+s+'">'+s+"</span></div>"}).join("")+"</div>"+(c.n<n?'<div class="m">'+(n-c.n)+" test case belum dinilai; akan ditulis “Belum dinilai” di report.</div>":"")+
 (p?'<div class="cd" style="display:flex;flex-direction:column;gap:6px"><div class="t">Report PDF siap</div><div class="m">'+esc(p.name)+" · "+Math.max(1,Math.round(p.blob.size/1024))+" KB</div></div>":'<div class="cd"><div class="t" style="margin-bottom:6px">Report PDF dibuat otomatis</div><div class="m">Pass rate '+rate+"% ("+c.Pass+" dari "+n+" test case). Isi report: ringkasan hasil, tabel semua test case, dan detail test case Fail dan Blocked.</div></div>"),
 f:p?'<button class="b b2" data-a="viewpdf">Lihat PDF</button><button class="b" data-a="go" data-g="list">Selesai</button>':'<button class="b" data-a="genrep">Buat Report PDF</button>'}},
pdf:function(){return{t:"Report PDF",b:'<div class="pv" id="pv"></div>',f:'<button class="b b2" data-a="getpdf">Unduh (browser)</button><button class="b" data-a="back">Kembali</button>'}}
};
function fsub(){var k=Object.keys(S.pick).filter(function(x){return S.pick[x]}),n=0;db.sets.forEach(function(s){if(S.pick[s.id])n+=s.cases.length});
 return'<button class="b" id="sub" data-a="submit"'+(k.length?"":" disabled")+">Submit"+(k.length?" ("+k.length+" dipilih · "+n+" test case)":"")+"</button>"}
function go(v){S.v=v;render()}
function render(){var v=V[S.v]();$("#t").textContent=v.t;$("#bk").hidden=S.v==="home";$("#m").innerHTML=v.b;$("#f").innerHTML=v.f||"";$("#f").hidden=!v.f;window.scrollTo(0,0);if(S.v==="pdf")showPdf()}
function today(){return new Date().toLocaleDateString("id-ID",{day:"numeric",month:"short"})}
var TG=window.Telegram&&window.Telegram.WebApp;if(TG){TG.ready();TG.expand()}
var SC={Pass:[20,97,47],Fail:[156,28,20],Blocked:[122,75,0],Skip:[61,72,82]};
function pdfSafe(s){return String(s==null?"":s).replace(/[^\t\n\r\x20-\x7E\xA0-\xFF\u2018\u2019\u201C\u201D\u2013\u2014\u2022\u2026]/g,"?")}
function colorCell(i){return function(h){if(h.section==="body"&&h.column.index===i){h.cell.styles.fontStyle="bold";h.cell.styles.textColor=SC[h.cell.raw]||[90,90,90]}}}
function genPdf(e){
 var J=window.jspdf.jsPDF,d=new J({unit:"pt",format:"a4"}),W=d.internal.pageSize.getWidth(),H=d.internal.pageSize.getHeight(),M=40,c=cnt(e),n=e.cases.length;
 var u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user,by=u?[u.first_name,u.last_name].filter(Boolean).join(" "):"";
 var now=new Date(),tgl=now.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
 d.setFont("helvetica","bold");d.setFontSize(18);d.text("Laporan Pengujian",M,52);
 d.setFontSize(13);var tl=d.splitTextToSize(pdfSafe(e.title),W-2*M);d.text(tl,M,76);
 var y=76+tl.length*16;
 d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(80);
 d.text("Tanggal: "+tgl+(by?"   |   Penguji: "+pdfSafe(by):""),M,y);y+=18;
 var base={styles:{font:"helvetica",fontSize:9,cellPadding:4,overflow:"linebreak"},headStyles:{fillColor:[26,111,179],textColor:255},margin:{left:M,right:M}};
 d.autoTable(Object.assign({},base,{startY:y,head:[["Total","Pass","Fail","Blocked","Skip","Belum dinilai","Pass rate"]],body:[[n,c.Pass,c.Fail,c.Blocked,c.Skip,n-c.n,(n?Math.round(c.Pass/n*100):0)+"%"]],styles:Object.assign({},base.styles,{halign:"center",fontSize:10})}));
 y=d.lastAutoTable.finalY+22;
 d.setTextColor(0);d.setFont("helvetica","bold");d.setFontSize(12);d.text("Hasil per test case",M,y);
 d.autoTable(Object.assign({},base,{startY:y+8,head:[["No","ID","Scenario","Status","Catatan"]],body:e.cases.map(function(x,i){return[i+1,pdfSafe(x.id),pdfSafe(x.sc),x.s||"Belum dinilai",pdfSafe(x.note)]}),columnStyles:{0:{cellWidth:26},1:{cellWidth:52},3:{cellWidth:62}},didParseCell:colorCell(3)}));
 var bad=e.cases.filter(function(x){return x.s==="Fail"||x.s==="Blocked"});
 if(bad.length){y=d.lastAutoTable.finalY+22;if(y>H-120){d.addPage();y=M+10}
  d.setTextColor(0);d.setFont("helvetica","bold");d.setFontSize(12);d.text("Detail Fail dan Blocked",M,y);
  d.autoTable(Object.assign({},base,{startY:y+8,head:[["ID / Scenario","Status","Langkah","Hasil diharapkan","Catatan"]],body:bad.map(function(x){return[pdfSafe(x.id+"\n"+x.sc),x.s,pdfSafe(x.st),pdfSafe(x.ex),pdfSafe(x.note)]}),columnStyles:{1:{cellWidth:50}},didParseCell:colorCell(1)}))}
 var N=d.getNumberOfPages();for(var i=1;i<=N;i++){d.setPage(i);d.setFont("helvetica","normal");d.setFontSize(8);d.setTextColor(120);d.text("QA Agent",M,H-20);d.text("Halaman "+i+" dari "+N,W-M,H-20,{align:"right"})}
 var name="report-"+(e.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"execution")+"-"+now.toISOString().slice(0,10)+".pdf",buf=d.output("arraybuffer"),blob=new Blob([buf],{type:"application/pdf"});
 return{name:name,buf:buf,blob:blob,url:URL.createObjectURL(blob)}}
async function showPdf(){var box=$("#pv");
 if(!window.pdfjsLib||!S.pdf){box.innerHTML='<div class="empty">Viewer PDF belum termuat, cek koneksi.</div>';return}
 box.innerHTML='<div class="empty">Memuat report…</div>';
 try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  var doc=await pdfjsLib.getDocument({data:new Uint8Array(S.pdf.buf.slice(0))}).promise;
  box.innerHTML="";var w=Math.min(box.clientWidth,900),r=window.devicePixelRatio||1;
  for(var i=1;i<=doc.numPages;i++){var pg=await doc.getPage(i),sc=w*r/pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:sc}),cv=document.createElement("canvas");
   cv.width=vp.width;cv.height=vp.height;cv.setAttribute("role","img");cv.setAttribute("aria-label","Halaman "+i+" dari "+doc.numPages);
   if(S.v!=="pdf")return;box.appendChild(cv);await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise}
 }catch(x){box.innerHTML='<div class="empty">Tidak bisa menampilkan PDF: '+esc(x.message)+"</div>"}}
function mk(e){if(!window.jspdf||!window.jspdf.jsPDF){toast("Library PDF belum termuat, cek koneksi");return null}
 try{var p=genPdf(e);if(S.pdf&&S.pdf.url)URL.revokeObjectURL(S.pdf.url);S.pdf=p;S.pdfId=e.id;return p}catch(x){toast("Gagal membuat PDF: "+x.message);return null}}
function dl(p){var a=document.createElement("a");a.href=p.url;a.download=p.name;document.body.appendChild(a);a.click();a.remove()}
function deliver(p){try{var f=new File([p.blob],p.name,{type:"application/pdf"});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:p.name}).catch(function(err){if(!err||err.name!=="AbortError")dl(p)});return}}catch(x){}
 dl(p)}
document.addEventListener("click",function(ev){var el=ev.target.closest("[data-a]");if(!el)return;var a=el.dataset.a,e=S.id&&ex(S.id);
 if(a==="go"){if(el.dataset.g==="imp")S.draft=null;if(el.dataset.g==="new")S.pick={};go(el.dataset.g)}
 else if(a==="back")go(S.v==="pdf"?S.pdfFrom:S.v==="run"||S.v==="fin"?"list":"home");
 else if(a==="sample"){S.draft={file:"contoh-login.xlsx",title:"Login & Registrasi",cases:toCases(SAMPLE)};render()}
 else if(a==="saveset"){var ti=$("#ti").value.trim();if(!ti)return toast("Isi judul dulu");db.sets.push({id:uid(),title:ti,at:today(),cases:S.draft.cases});save();S.draft=null;toast("Test case tersimpan");go("home")}
 else if(a==="submit"){var tt=$("#te").value.trim();if(!tt)return toast("Isi judul test execution");var cs=[];db.sets.forEach(function(s){if(S.pick[s.id])s.cases.forEach(function(c){cs.push({id:c.id,sc:c.sc,st:c.st,ex:c.ex,s:"",note:""})})});db.execs.unshift({id:uid(),title:tt,cases:cs,idx:0,done:false,report:null});save();toast("Test execution dibuat");go("list")}
 else if(a==="play"){S.id=el.dataset.i;S.pdf=null;go("run")}
 else if(a==="st"){e.cases[e.idx].s=el.dataset.s;save();render()}
 else if(a==="prev"){e.idx--;save();render()}
 else if(a==="next"){if(e.idx<e.cases.length-1){e.idx++;save();render()}else go("fin")}
 else if(a==="genrep"){var p=mk(e);if(!p)return;e.done=true;e.report={name:p.name,at:Date.now()};save();S.pdfFrom="fin";S.v="pdf";render()}
 else if(a==="getpdf"){deliver(S.pdf)}
 else if(a==="viewpdf"){S.pdfFrom="fin";S.v="pdf";render()}
 else if(a==="rep"){var x=ex(el.dataset.i),q=mk(x);if(q){S.id=x.id;S.pdfFrom="list";S.v="pdf";render()}}
});
document.addEventListener("input",function(ev){var e=S.id&&ex(S.id);if(ev.target.id==="no"&&e){e.cases[e.idx].note=ev.target.value;save()}if(ev.target.id==="ti"&&S.draft)S.draft.title=ev.target.value});
document.addEventListener("change",function(ev){var t=ev.target;
 if(t.dataset.s&&t.type==="checkbox"){S.pick[t.dataset.s]=t.checked;$("#f").innerHTML=fsub()}
 else if(t.id==="fx"&&t.files[0]){var f=t.files[0],rd=new FileReader();rd.onload=function(){try{var w=XLSX.read(rd.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:""}),cs=parse(rows);if(!cs.length)return toast("Tidak ada test case terbaca");S.draft={file:f.name,title:f.name.replace(/\.[^.]+$/,""),cases:cs};render()}catch(x){toast("File tidak bisa dibaca")}};rd.readAsArrayBuffer(f)}
});
render();
</script>
</body>
</html>
